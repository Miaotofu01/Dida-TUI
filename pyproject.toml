[project]
name = "dida-tui"
version = "0.1.0"
description = "终端里的滴答清单今日执行台"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
    "httpx>=0.28.0",
    "tomli-w>=1.1.0",
]

[project.scripts]
dida = "dida.bootstrap:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dida"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
