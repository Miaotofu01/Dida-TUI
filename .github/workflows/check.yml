name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # 全量跑一遍。约 4 分钟、近千条——跑得久不等于挂了。
      - run: uv run pytest -q

  commit-messages:
    # 仓库的规矩：每个提交都要写票号（#NN），合并提交也算。
    # Spec 复核靠从 `git log` 里刮 #NN 来定位 spec，所以这条不是洁癖，是复核的输入。
    # 只看这个 PR 带进来的提交（base..HEAD），历史提交不管。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 每个提交都写了票号
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # 用 head.sha 而不是 HEAD：checkout 默认落在 GitHub 合成的那条
          # 「Merge <sha> into <sha>」上，它永远不带票号，会让这条检查假红。
          # head.sha 是本 PR 真正的顶端，**包含**你自己造的合并提交——那些按规矩也要写票号。
          head='${{ github.event.pull_request.head.sha }}'
          bad=0
          for sha in $(git rev-list "$base".."$head"); do
            msg=$(git log -1 --format='%s%n%b' "$sha")
            if ! printf '%s' "$msg" | grep -qE '#[0-9]+'; then
              echo "::error::$sha 的提交信息里没有票号：$(git log -1 --format=%s "$sha")"
              bad=1
            fi
          done
          exit $bad
